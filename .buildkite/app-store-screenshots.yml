# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# Takes an app's App Store screenshots: one job per device and language, then one that composes
# them. The app is SCREENSHOTS_APP, `jetpack` or `wordpress`. Start it with
# `bundle exec fastlane trigger_app_store_screenshots app:<app>`. See docs/app-store-screenshots.md.

# Below everything else's default of 0, so that its 50-odd jobs only take Mac agents nothing else
# is waiting for, and never hold up a PR or trunk build. (The release pipelines are at 1.)
priority: -1

agents:
  queue: mac
env:
  # The iPhone Duo's screenshots need an app built with the iOS 27.1 SDK: built with an older one,
  # the app runs letterboxed on the Duo's outer display.
  IMAGE_ID: xcode-27.1

# The app, SCREENSHOTS_APP, is passed to each command as an argument. Buildkite fills it in when it
# uploads the pipeline; an environment variable set here wouldn't reach the jobs, which run in a VM.

# The App Store languages the screenshots are taken in: the ones with headlines in
# fastlane/appstoreres/jetpack_metadata and fastlane/appstoreres/metadata.
x-locales: &locales
  - "ar-SA"
  - "de-DE"
  - "en-US"
  - "es-ES"
  - "fr-FR"
  - "he"
  - "id"
  - "it"
  - "ja"
  - "ko"
  - "nl-NL"
  - "pt-BR"
  - "ru"
  - "sv"
  - "tr"
  - "zh-Hans"
  - "zh-Hant"

# A step per device, because a matrix can make at most 50 jobs and three devices in 17 languages
# would be 51.
x-screenshots: &screenshots
  depends_on: "build"
  plugins: [$CI_TOOLKIT_PLUGIN]
  timeout_in_minutes: 30
  artifact_paths:
    - "fastlane/${SCREENSHOTS_APP:-jetpack}_screenshots/**/*.png"
    - "build/results/screenshots/*.log"
  retry:
    automatic:
      - exit_status: "*"
        limit: 1

steps:
  - label: "🛠 Build ${SCREENSHOTS_APP:-jetpack} for Screenshots"
    key: "build"
    command: ".buildkite/commands/build-for-app-store-screenshots.sh ${SCREENSHOTS_APP:-jetpack}"
    plugins: [$CI_TOOLKIT_PLUGIN]

  - label: "📸 iPhone 18 Pro Max {{matrix}}"
    key: "screenshots_iphone"
    command: ".buildkite/commands/take-app-store-screenshots.sh ${SCREENSHOTS_APP:-jetpack} 'iPhone 18 Pro Max' '{{matrix}}'"
    matrix: *locales
    <<: *screenshots

  - label: "📸 iPad Pro 13-inch (M5) {{matrix}}"
    key: "screenshots_ipad"
    command: ".buildkite/commands/take-app-store-screenshots.sh ${SCREENSHOTS_APP:-jetpack} 'iPad Pro 13-inch (M5)' '{{matrix}}'"
    matrix: *locales
    <<: *screenshots

  - label: "📸 iPhone Duo {{matrix}}"
    key: "screenshots_duo"
    command: ".buildkite/commands/take-app-store-screenshots.sh ${SCREENSHOTS_APP:-jetpack} 'iPhone Duo' '{{matrix}}'"
    matrix: *locales
    <<: *screenshots

  - label: "🖼️ Compose Screenshots"
    command: ".buildkite/commands/compose-app-store-screenshots.sh ${SCREENSHOTS_APP:-jetpack}"
    # Compose whatever was taken, so that one failed job doesn't hide all the others' screenshots.
    depends_on:
      - step: "screenshots_iphone"
        allow_failure: true
      - step: "screenshots_ipad"
        allow_failure: true
      - step: "screenshots_duo"
        allow_failure: true
    plugins: [$CI_TOOLKIT_PLUGIN]
    artifact_paths:
      - "fastlane/${SCREENSHOTS_APP:-jetpack}_promo_screenshots.zip"
      - "fastlane/${SCREENSHOTS_APP:-jetpack}_screenshots_overview/*.png"
