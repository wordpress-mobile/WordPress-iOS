# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# Takes the Jetpack App Store screenshots: one job per device and language, then one that composes
# them. Start it with `bundle exec fastlane trigger_jetpack_screenshots`. See docs/app-store-screenshots.md.

agents:
  queue: mac
env:
  # The iPhone Duo's screenshots need an app built with the iOS 27.1 SDK: built with an older one,
  # the app runs letterboxed on the Duo's outer display.
  IMAGE_ID: xcode-27.1

# The App Store languages the screenshots are taken in: the folders in fastlane/appstoreres/jetpack_metadata.
x-locales: &locales
  - "ar-SA"
  - "de-DE"
  - "en-US"
  - "es-ES"
  - "fr-FR"
  - "he"
  - "id"
  - "it"
  - "ja"
  - "ko"
  - "nl-NL"
  - "pt-BR"
  - "ru"
  - "sv"
  - "tr"
  - "zh-Hans"
  - "zh-Hant"

# A step per device, because a matrix can make at most 50 jobs and three devices in 17 languages
# would be 51.
x-screenshots: &screenshots
  depends_on: "build_jetpack"
  plugins: [$CI_TOOLKIT_PLUGIN]
  timeout_in_minutes: 30
  artifact_paths:
    - "fastlane/jetpack_screenshots/**/*.png"
    - "build/results/screenshots/*.log"
  retry:
    automatic:
      - exit_status: "*"
        limit: 1

steps:
  - label: "🛠 :jetpack: Build for Screenshots"
    key: "build_jetpack"
    command: ".buildkite/commands/build-for-testing.sh jetpack http_fixtures:true"
    plugins: [$CI_TOOLKIT_PLUGIN]

  - label: "📸 iPhone 18 Pro Max {{matrix}}"
    key: "screenshots_iphone"
    command: ".buildkite/commands/take-app-store-screenshots.sh 'iPhone 18 Pro Max' '{{matrix}}'"
    matrix: *locales
    <<: *screenshots

  - label: "📸 iPad Pro 13-inch (M5) {{matrix}}"
    key: "screenshots_ipad"
    command: ".buildkite/commands/take-app-store-screenshots.sh 'iPad Pro 13-inch (M5)' '{{matrix}}'"
    matrix: *locales
    <<: *screenshots

  - label: "📸 iPhone Duo {{matrix}}"
    key: "screenshots_duo"
    command: ".buildkite/commands/take-app-store-screenshots.sh 'iPhone Duo' '{{matrix}}'"
    matrix: *locales
    <<: *screenshots

  - label: "🖼️ Compose Screenshots"
    command: ".buildkite/commands/compose-app-store-screenshots.sh"
    # Compose whatever was taken, so that one failed job doesn't hide all the others' screenshots.
    depends_on:
      - step: "screenshots_iphone"
        allow_failure: true
      - step: "screenshots_ipad"
        allow_failure: true
      - step: "screenshots_duo"
        allow_failure: true
    plugins: [$CI_TOOLKIT_PLUGIN]
    artifact_paths:
      - "fastlane/jetpack_promo_screenshots.zip"
      - "fastlane/jetpack_screenshots_overview/*.png"
