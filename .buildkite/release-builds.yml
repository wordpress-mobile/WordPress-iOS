# This pipeline is meant to be run via the Buildkite API, and is only used for release builds

agents:
  queue: mac
env:
  IMAGE_ID: $IMAGE_ID

steps:

  - label: ":wordpress: :testflight: WordPress Release Build (App Store Connect)"
    command: |
      git fetch origin "iangmaia/use-buildkite-pipeline-upload"
      git checkout "iangmaia/use-buildkite-pipeline-upload"

      echo "RELEASE_VERSION: $RELEASE_VERSION"
      echo "IS_BETA_RELEASE: $IS_BETA_RELEASE"
    plugins: [$CI_TOOLKIT_PLUGIN]
    # notify:
    #   - slack: "#build-and-ship"
    # retry:
    #   manual:
    #     # If those jobs fail, one should always prefer re-triggering a new build from ReleaseV2 rather than retrying the individual job from Buildkite
    #     allowed: false

  - label: ":jetpack: :testflight: Jetpack Release Build (App Store Connect)"
    command: |
      echo "RELEASE_VERSION: $RELEASE_VERSION"
      echo "IS_BETA_RELEASE: $IS_BETA_RELEASE"
    plugins: [$CI_TOOLKIT_PLUGIN]
    # notify:
    #   - slack: "#build-and-ship"
    # retry:
    #   manual:
    #     # If those jobs fail, one should always prefer re-triggering a new build from ReleaseV2 rather than retrying the individual job from Buildkite
    #     allowed: false
