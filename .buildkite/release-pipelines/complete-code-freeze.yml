# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

env:
  IMAGE_ID: $IMAGE_ID

# The code freeze completion needs to run on macOS because it uses genstrings under the hood
agents:
  queue: mac

priority: 1

steps:
  - label: Complete Code Freeze
    key: complete_code_freeze
    plugins: [$CI_TOOLKIT_PLUGIN]
    # Temporary: drop RBENV_VERSION once .ruby-version is 3.4.13 (AINFRA-3881); the Linux agents lack it until AINFRA-3889/3890/3891.
    command: RBENV_VERSION=3.4.13 .buildkite/commands/complete-code-freeze.sh "$RELEASE_VERSION"
    retry:
      manual:
        # If those jobs fail, one should always prefer re-triggering a new build from Releases V2 rather than retrying the individual job from Buildkite
        reason: If release jobs fail, you should always re-trigger the task from Releases V2 rather than retrying the individual job from Buildkite
        allowed: false
