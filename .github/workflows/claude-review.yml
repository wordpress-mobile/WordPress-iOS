name: PR Review with Progress Tracking

on:
  issue_comment:
    types: [created]

jobs:
  check-pr-origin:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      allowed: ${{ steps.pr-origin.outputs.allowed }}
    steps:
      # issue_comment payloads identify PR comments, but do not include the PR
      # head repo or branch. Query both before exposing review credentials.
      - name: Check PR eligibility
        id: pr-origin
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! head="$(gh api "repos/${REPOSITORY}/pulls/${ISSUE_NUMBER}" --jq '.head | [.repo.full_name, .ref] | @tsv')"; then
            echo "Unable to determine PR head for #${ISSUE_NUMBER}; skipping Claude."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=$'\t' read -r head_repo head_ref <<< "$head"

          if [[ "$head_repo" == "$REPOSITORY" && -n "$head_ref" && "$head_ref" != iris/task-* ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Claude for ${head_repo:-unknown}:${head_ref:-unknown}."
          fi


  review-with-tracking:
    needs: check-pr-origin
    if: needs.check-pr-origin.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write # Required by claude-code-action for GitHub App token exchange.
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@6a838f847a10bc4b88da6ae796ff68e74cf9f4cc # v1.0.158
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Perform a comprehensive code review with the following focus areas:

            1. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Code readability and maintainability

            2. **Security**
               - Check for potential security vulnerabilities
               - Validate input sanitization
               - Review authentication/authorization logic

            3. **Performance**
               - Identify potential performance bottlenecks
               - Review database queries for efficiency
               - Check for memory leaks or resource issues

            4. **Testing**
               - Verify adequate test coverage
               - Review test quality and edge cases
               - Check for missing test scenarios

            5. **Documentation**
               - Ensure code is properly documented
               - Verify README updates for new features
               - Check API documentation accuracy

            Provide detailed feedback using inline comments for specific issues.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
