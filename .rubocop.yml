AllCops:
  Exclude:
    - DerivedData/**/*
    - vendor/**/*
    - WordPressKit/**/*
  NewCops: enable

Metrics/BlockLength:
  # "xfiles" is a standin for `Fast-`, `Pod-`, and `Rake-file`
  Exclude: &xfiles
    - fastlane/Fastfile
    - fastlane/lanes/*.rb
    - Podfile
    - Rakefile

Metrics/MethodLength:
  Max: 30
  Exclude: *xfiles

Layout/LineLength:
  Max: 165
  Exclude: *xfiles

Layout/EmptyLines:
  Exclude: *xfiles

Style/AsciiComments:
  Exclude: *xfiles

Style/Documentation:
  Exclude:
    - '**/*_test.rb'

Naming/FileName:
  Exclude:
    - fastlane/Matchfile

Style/HashSyntax:
  EnforcedShorthandSyntax: never
