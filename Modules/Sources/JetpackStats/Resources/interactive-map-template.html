<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        svg {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }
        path {
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        path:hover {
            opacity: 0.8;
            stroke-width: 2;
        }
        path.selected {
            stroke-width: 3;
            stroke: #007AFF;
        }
    </style>
    <script>
        let selectedCountry = null;
        
        function selectCountry(element) {
            if (selectedCountry && selectedCountry !== element) {
                selectedCountry.classList.remove('selected');
            }
            if (element && element.id) {
                element.classList.add('selected');
                selectedCountry = element;
                window.webkit.messageHandlers.countrySelected.postMessage(element.id);
            }
        }
        
        function deselectCountry() {
            if (selectedCountry) {
                selectedCountry.classList.remove('selected');
                selectedCountry = null;
                window.webkit.messageHandlers.countrySelected.postMessage(null);
            }
        }
        
        function setupCountryInteractions() {
            const svg = document.querySelector('svg');
            const paths = document.querySelectorAll('path[id]');
            
            // Touch events for mobile
            svg.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    // Single touch - selection on tap only
                    const touch = e.touches[0];
                    const element = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (element && element.tagName === 'path' && element.id) {
                        selectCountry(element);
                    } else if (element === svg || !element.id) {
                        // Tapped outside any country - deselect
                        deselectCountry();
                    }
                } else if (e.touches.length === 2) {
                    // Two touches - prevent zoom
                    e.preventDefault();
                }
            }, { passive: false });
            
            svg.addEventListener('touchmove', function(e) {
                // Prevent any dragging behavior
                e.preventDefault();
            }, { passive: false });
            
            svg.addEventListener('touchend', function(e) {
                // Do nothing - keep selection until user taps elsewhere
            }, { passive: false });
            
            // Mouse events for desktop - click only
            paths.forEach(path => {
                path.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    selectCountry(this);
                });
            });
            
            // Deselect when clicking outside any country
            svg.addEventListener('click', function(e) {
                if (e.target === svg || !e.target.id) {
                    deselectCountry();
                }
            });
        }
        
        // Setup interactions when DOM is loaded
        document.addEventListener('DOMContentLoaded', setupCountryInteractions);
    </script>
</head>
<body>
    <!-- SVG_CONTENT_PLACEHOLDER -->
</body>
</html>
