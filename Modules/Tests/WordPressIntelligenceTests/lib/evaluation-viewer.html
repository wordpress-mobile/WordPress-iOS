             * Clear the current baseline comparison
             */
            clearBaseline() {
                ComparisonEngine.clearComparisonIndicators();
                AppState.baselineReports = [];
                AppState.currentBaseline = null;

                // Re-render table without baseline rows
                Renderer.renderTable(AppState.currentReport.results);

                // Hide delta column
                this.toggleDeltaColumn(false);

                // Update allRows reference after re-render
                TableController.allRows = Array.from(document.querySelectorAll('.test-row'));

                // Hide comparison indicator, show compare button
                DOM.get('comparisonIndicator').style.display = 'none';
                DOM.get('compareButtonContainer').style.display = '';
                DOM.get('comparisonSummary').style.display = 'none';

                // Reset comparison filter
                document.getElementById('comparisonFilter').value = '';
                AppState.filters.comparisonStatus = '';
                TableController.applyFilters();

                console.log('Baseline comparison cleared');
            },

            /**
             * Load baseline from file and apply comparison
             */
            async loadBaselineFromFile(file) {
                const statusEl = DOM.get('baselineStatus');
                statusEl.textContent = 'Loading...';
                statusEl.style.color = 'var(--text-secondary)';

                try {
                    const data = await DataLoader.loadReportFromFile(file);
                    this.applyBaseline(data, file.name, 'file');
                } catch (err) {
                    statusEl.textContent = `✗ Error: ${err.message}`;
                    statusEl.style.color = 'var(--color-fail)';
                    console.error('Error loading baseline:', err);
                    throw err;
                }
            },

            /**
             * Toggle visibility of the delta column
             * @param {boolean} show - True to show, false to hide
             */
            toggleDeltaColumn(show) {
                const deltaColumn = DOM.get('deltaColumn');
                const deltaCells = document.querySelectorAll('.delta-cell');

                if (show) {
                    deltaColumn.style.display = '';
                    deltaCells.forEach(cell => cell.style.display = '');
                } else {
                    deltaColumn.style.display = 'none';
                    deltaCells.forEach(cell => cell.style.display = 'none');
                }
            }
        };

        // ===== Module 4: TableController (Filtering & Sorting) =====
        const TableController = {
            allRows: [],

            refreshRowCache() {
                this.allRows = Array.from(document.querySelectorAll('.test-row'));
            },

            selectTest(idx, isBaseline = false) {
                document.querySelectorAll('.test-row').forEach(row => row.classList.remove('selected'));

                // Find the specific row (baseline or current)
                const row = document.querySelector(`.test-row[data-idx="${idx}"][data-is-baseline="${isBaseline}"]`);
                if (row) row.classList.add('selected');

                // Load result from appropriate data source
                const result = isBaseline
                    ? AppState.currentBaseline.results[idx]
                    : AppState.currentReport.results[idx];

                Renderer.renderDetailPanel(result);

                AppState.selectedTestIndex = idx;
            },

            sortTable(column) {
                const tbody = DOM.get('tableBody');
                const rows = Array.from(tbody.querySelectorAll('.test-row'));

                if (AppState.sortConfig.column === column) {
                    AppState.sortConfig.order = AppState.sortConfig.order === 'asc' ? 'desc' : 'asc';
                } else {
                    AppState.sortConfig.column = column;
                    AppState.sortConfig.order = 'desc';
                }

                rows.sort((a, b) => {
                    let aVal, bVal;

                    switch (column) {
                        case 'name':
                            aVal = a.querySelector('.test-name').textContent;
                            bVal = b.querySelector('.test-name').textContent;
                            return AppState.sortConfig.order === 'asc' ?
                                aVal.localeCompare(bVal) : bVal.localeCompare(aVal);

                        case 'status':
                            const statusOrder = {'passed': 1, 'needsImprovement': 2, 'failed': 3};
                            aVal = statusOrder[a.classList[1]] || 999;
                            bVal = statusOrder[b.classList[1]] || 999;
                            break;

                        case 'avg':
                            aVal = parseFloat(a.dataset.avg);
                            bVal = parseFloat(b.dataset.avg);
                            break;

                        case 'min':
                            aVal = parseFloat(a.dataset.min);
                            bVal = parseFloat(b.dataset.min);
                            break;

                        case 'duration':
                            aVal = parseFloat(a.dataset.duration);
                            bVal = parseFloat(b.dataset.duration);
                            break;

                        case 'delta':
                            aVal = parseFloat(a.dataset.delta || 0);
                            bVal = parseFloat(b.dataset.delta || 0);
                            break;
                    }

                    return AppState.sortConfig.order === 'asc' ? aVal - bVal : bVal - aVal;
                });

                rows.forEach(row => tbody.appendChild(row));

                document.querySelectorAll('th').forEach(th => th.className = '');
                const headers = ['name', 'status', 'avg', 'min', 'delta', 'duration'];
                const idx = headers.indexOf(column);
                if (idx >= 0) {
                    document.querySelectorAll('th')[idx].className = 'sorted-' + AppState.sortConfig.order;
                }

                this.refreshRowCache();
            },

            applyFilters() {
                const search = AppState.filters.search.toLowerCase();
                const language = AppState.filters.language.toLowerCase();
                const comparisonStatus = AppState.filters.comparisonStatus;

                this.allRows.forEach(row => {
                    const testName = row.querySelector('.test-name').textContent.toLowerCase();
                    const rowComparisonStatus = row.dataset.comparisonStatus;

                    let visible = true;

                    if (search && !testName.includes(search)) visible = false;
                    if (language && !testName.includes(language)) visible = false;
                    if (comparisonStatus && rowComparisonStatus !== comparisonStatus) visible = false;

                    row.style.display = visible ? '' : 'none';
                });
            }
        };

        // ===== Module 5: ComparisonEngine =====
        const ComparisonEngine = {
            updateComparisonIndicators(baselineData) {
                console.log('Updating comparison indicators...');

                // Show delta column and comparison info
                DOM.get('deltaColumn').style.display = '';
                document.querySelectorAll('.delta-cell').forEach(cell => cell.style.display = '');

                // Update comparison info header
                const currentTimestamp = AppState.currentReport.metadata.timestamp;
                const baselineTimestamp = baselineData.metadata.timestamp;
                const currentDate = new Date(currentTimestamp).toLocaleString();
                const baselineDate = new Date(baselineTimestamp).toLocaleString();

                // Comparison UI is now handled by BaselineManager's header indicator
                console.log('Comparison UI updated');
            },

            clearComparisonIndicators() {
                DOM.get('deltaColumn').style.display = 'none';
                document.querySelectorAll('.delta-cell').forEach(cell => cell.style.display = 'none');
                // comparisonInfo removed - now using header indicator instead
            }
        };

        // ===== Module 5.5: TabController (Test Suite Switching) =====
        const TabController = {
            /**
             * Switch to a different test suite tab
             */
            switchTab(testType) {
                // Check if report exists for this test type
                if (!AppState.reports[testType]) {
                    console.log(`No report loaded for test type: ${testType}`);
                    return;
                }

                // Update active test type
                AppState.activeTestType = testType;
                AppState.currentReport = AppState.reports[testType];
                AppState.currentBaseline = AppState.baselines[testType];

                // Update header
                const testCount = AppState.currentReport.summary.total || 0;
                document.getElementById('testCount').textContent = `${testCount} test${testCount !== 1 ? 's' : ''}`;

                const statusEl = document.getElementById('statusIndicator');
                const summary = AppState.currentReport.summary;
                const failed = summary.failed || 0;
                const needsWork = summary.needsImprovement || 0;

                if (failed > 0) {
                    statusEl.className = 'status-indicator has-failures';
                    statusEl.innerHTML = `<span class="status-dot"></span>${failed} failed`;
                } else if (needsWork > 0) {
                    statusEl.className = 'status-indicator';
                    statusEl.style.color = '#ff9500';
                    statusEl.innerHTML = `<span class="status-dot"></span>${needsWork} needs work`;
                } else {
                    statusEl.className = 'status-indicator all-pass';
                    statusEl.innerHTML = `<span class="status-dot"></span>All passed`;
                }

                // Re-render the view
                Renderer.renderTable(AppState.currentReport.results);
                TableController.allRows = Array.from(document.querySelectorAll('.test-row'));

                // Auto-select first test
                if (AppState.currentReport.results.length > 0) {
                    TableController.selectTest(0);
                }

                // Apply comparison if baseline exists for this test type
                if (AppState.currentBaseline) {
                    ComparisonEngine.updateComparisonIndicators(AppState.currentBaseline);
                    BaselineManager.toggleDeltaColumn(true);
                } else {
                    BaselineManager.toggleDeltaColumn(false);
                }

                console.log(`Switched to ${testType} tab`);
            },

            /**
             * Update tab button states
             */
            updateTabUI(activeType) {
                const tabs = {
                    'excerpt-generation': 'tabExcerpts',
                    'tag-suggestion': 'tabTags',
                    'post-summary': 'tabSummary'
                };

                // Update active state
                Object.entries(tabs).forEach(([type, tabId]) => {
                    const tabButton = document.getElementById(tabId);
                    if (type === activeType) {
                        tabButton.classList.add('active');
                    } else {
                        tabButton.classList.remove('active');
                    }
                });
            },

            /**
             * Update tab counts and enabled states
             */
            updateTabStates() {
                const tabs = [
                    { type: 'excerpt-generation', buttonId: 'tabExcerpts', countId: 'countExcerpts' },
                    { type: 'tag-suggestion', buttonId: 'tabTags', countId: 'countTags' },
                    { type: 'post-summary', buttonId: 'tabSummary', countId: 'countSummary' }
                ];

                tabs.forEach(tab => {
                    const report = AppState.reports[tab.type];
                    const button = document.getElementById(tab.buttonId);
                    const countSpan = document.getElementById(tab.countId);

                    if (report) {
                        button.disabled = false;
                        countSpan.textContent = report.results.length;
                    } else {
                        button.disabled = (tab.type !== AppState.activeTestType);
                        countSpan.textContent = '0';
                    }
                });
            },

            /**
             * Show or hide the tabs bar
             */
            showTabs(show) {
                const tabsContainer = document.getElementById('testSuiteTabs');
                tabsContainer.style.display = show ? 'flex' : 'none';
            }
        };

        // ===== Module 6: Initialization & Event Handlers =====
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize DOM cache
            DOM.init();

            // Helper function to update header status
            function updateHeaderStatus(data) {
                const testType = data.metadata.testType || 'excerpt-generation';
                const summary = data.summary;

                // Update test type selector
                document.getElementById('testTypeSelector').value = testType;

                // Update test count
                const testCount = summary.total || 0;
                document.getElementById('testCount').textContent = `${testCount} test${testCount !== 1 ? 's' : ''}`;

                // Update average score
                const avgScore = summary.averageScore || 0;
                document.getElementById('averageScore').textContent = `Avg: ${avgScore.toFixed(1)}`;

                // Update status indicator
                const statusEl = document.getElementById('statusIndicator');
                const failed = summary.failed || 0;
                const needsWork = summary.needsImprovement || 0;

                if (failed > 0) {
                    statusEl.className = 'status-indicator has-failures';
                    statusEl.innerHTML = `<span class="status-dot"></span>${failed} failed`;
                } else if (needsWork > 0) {
                    statusEl.className = 'status-indicator';
                    statusEl.style.color = '#ff9500';
                    statusEl.innerHTML = `<span class="status-dot"></span>${needsWork} needs work`;
                } else {
                    statusEl.className = 'status-indicator all-pass';
                    statusEl.innerHTML = `<span class="status-dot"></span>All passed`;
                }
            }

            // Helper function to load and render report data
            function loadAndRenderReport(data) {
                // Detect test type from metadata
                const testType = data.metadata.testType || 'excerpt-generation';

                // Store report in appropriate slot
                AppState.reports[testType] = data;
                AppState.activeTestType = testType;
                AppState.currentReport = data;

                // Show UI elements
                DOM.get('emptyState').style.display = 'none';
                DOM.get('mainContent').style.display = 'block';
                document.getElementById('headerContainer').style.display = 'block';
                DOM.get('filterControls').style.display = 'flex';

                // Update header
                updateHeaderStatus(data);

                // Render table
                Renderer.renderTable(data.results);
                TableController.refreshRowCache();

                if (data.results.length > 0) {
                    TableController.selectTest(0);
                }

                TableController.sortTable('avg');

                // Log baseline folder location to console
                if (data.metadata && data.metadata.outputDirectory) {
                    const outputDir = data.metadata.outputDirectory;
                    const parentDir = outputDir.split('/').slice(0, -1).join('/');
                    console.log('%c📁 Baseline Files Location', 'font-size: 14px; font-weight: bold; color: #007bff;');
                    console.log(`Parent directory: ${parentDir}`);
                    console.log(`Look for directories named "evaluation-YYYY-MM-DD-HHMMSS" to find baseline JSON files.`);
                    console.log(''); // Empty line for spacing
                }
            }

            // Auto-load embedded data if present
            if (EMBEDDED_DATA !== null) {
                try {
                    loadAndRenderReport(EMBEDDED_DATA);

                    // Check for embedded baseline and apply comparison
                    if (typeof EMBEDDED_BASELINE !== 'undefined' && EMBEDDED_BASELINE !== null) {
                        console.log('Embedded baseline detected, applying comparison...');
                        BaselineManager.applyBaseline(EMBEDDED_BASELINE, 'Embedded Baseline', 'embedded');
                    }
                } catch (err) {
                    console.error('Error loading embedded data:', err);
                }
            }

            // Baseline file picker - automatically compares when baseline is selected
            DOM.get('baselineInput').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                await BaselineManager.loadBaselineFromFile(file);
            });

            // Drag and drop support for baseline files
            const dropOverlay = DOM.get('dropOverlay');

            document.body.addEventListener('dragenter', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (e.dataTransfer.types.includes('Files')) {
                    dropOverlay.classList.add('active');
                }
            });

            document.body.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
            });

            document.body.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (e.target === document.body || e.target === dropOverlay) {
                    dropOverlay.classList.remove('active');
                }
            });

            document.body.addEventListener('drop', async (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropOverlay.classList.remove('active');

                const files = Array.from(e.dataTransfer.files);
                const jsonFile = files.find(f => f.name.endsWith('.json'));

                if (jsonFile) {
                    await BaselineManager.loadBaselineFromFile(jsonFile);
                } else {
                    console.log('No JSON file found in dropped files');
                }
            });

            DOM.get('searchInput').addEventListener('input', (e) => {
                AppState.filters.search = e.target.value;
                TableController.applyFilters();
            });

            DOM.get('languageFilter').addEventListener('change', (e) => {
                AppState.filters.language = e.target.value;
                TableController.applyFilters();
            });

            document.getElementById('comparisonFilter').addEventListener('change', (e) => {
                AppState.filters.comparisonStatus = e.target.value;
                TableController.applyFilters();
            });
        });
    </script>
</body>
</html>
